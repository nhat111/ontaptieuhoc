name: Sao lưu DB

# Mỗi đêm dump schema `public` của Supabase (bài, câu hỏi, kết quả, góp ý…),
# mã hoá rồi lưu làm artifact 30 ngày. Xoá bài/chương là cascade, không có
# thùng rác, nên đây là đường lui duy nhất.
#
# Repo public: artifact ai đăng nhập GitHub cũng tải được, và bảng `feedback`
# có số điện thoại/email phụ huynh, nên bản dump LUÔN được mã hoá (gpg AES256).
#
# Cần 2 secret (Settings → Secrets and variables → Actions):
# - SUPABASE_DB_URL: chuỗi "Session pooler" ở Supabase → Connect (cổng 5432,
#   host *.pooler.supabase.com). Đừng dùng "Direct connection": nó chỉ có
#   IPv6, máy GitHub không gọi tới được.
# - BACKUP_PASSPHRASE: mật khẩu mã hoá, tự đặt, cất ở chỗ khác ngoài GitHub.
#   Mất nó là mất luôn bản sao lưu.
# Thiếu secret thì job chỉ ghi cảnh báo và kết thúc xanh.
#
# Khôi phục (xem thêm .claude/ai-context/feature-specs/backup.md):
#   gpg -d db-<ngày>.sql.gz.gpg | gunzip > db.sql
#   psql "<chuỗi kết nối>" -f db.sql   # vào DB trống / project mới

on:
  schedule:
    - cron: "17 19 * * *" # 02:17 giờ Việt Nam
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Kiểm tra secret
        id: cfg
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::warning::Chưa đặt SUPABASE_DB_URL hoặc BACKUP_PASSPHRASE, bỏ qua sao lưu."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # pg_dump phải cùng hoặc mới hơn bản Postgres của Supabase.
      - name: Cài pg_dump 17
        if: steps.cfg.outputs.ok == 'true'
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Dump và mã hoá
        if: steps.cfg.outputs.ok == 'true'
        run: |
          set -o pipefail
          file="db-$(date -u +%Y-%m-%d).sql.gz.gpg"
          pg_dump "$DB_URL" --schema=public --no-owner --no-privileges \
            | gzip -9 \
            | gpg --batch --yes --symmetric --cipher-algo AES256 \
                --passphrase-fd 3 -o "$file" 3<<< "$PASSPHRASE"
          # Dump rỗng/hỏng mà vẫn báo xanh thì tệ hơn báo đỏ.
          size=$(stat -c %s "$file")
          if [ "$size" -lt 2048 ]; then
            echo "::error::Bản sao lưu chỉ $size byte, có thể đã hỏng."
            exit 1
          fi
          echo "FILE=$file" >> "$GITHUB_ENV"
          echo "Đã sao lưu $file ($size byte)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: 30
          compression-level: 0
